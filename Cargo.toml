[workspace]
resolver = "3"
members = ["crates/proto", "crates/stew", "crates/box"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
stew-proto = { path = "crates/proto" }
tempfile = "3"
